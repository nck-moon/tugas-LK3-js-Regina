<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Logika Dasar JS</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f7f1ff;
    color: #40334f;
}

.hidden {
    display: none !important;
}

/* ================= WELCOME SCREEN ================= */

#welcomeScreen {
    position: fixed;
    inset: 0;
    z-index: 9999;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    overflow: hidden;

    background: linear-gradient(
        -45deg,
        #ffe0f0,
        #e8d5ff,
        #fff4d6,
        #d8f7ff,
        #f6dcff
    );

    background-size: 400% 400%;
    animation: backgroundBergerak 10s ease infinite;

    transition: opacity 0.8s ease, visibility 0.8s ease;
}

#welcomeScreen.sembunyi {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
}

.welcome-content {
    position: relative;
    z-index: 2;
    padding: 25px;
    animation: munculTeks 1.2s ease;
}

.welcome-content h1 {
    font-size: clamp(30px, 5vw, 55px);
    color: #7544a5;
    text-shadow: 2px 3px 10px white;
    margin-bottom: 25px;
    animation: teksMengambang 3s ease-in-out infinite;
}

.welcome-content p {
    font-size: 18px;
    color: #7544a5;
    animation: kedipTeks 1.8s ease-in-out infinite;
}

.welcome-dekorasi {
    position: absolute;
    font-size: 35px;
    opacity: 0.7;
    animation: dekorasiMengambang 5s ease-in-out infinite;
}

.dekorasi-1 {
    top: 15%;
    left: 12%;
}

.dekorasi-2 {
    top: 25%;
    right: 15%;
    animation-delay: 1s;
}

.dekorasi-3 {
    bottom: 18%;
    left: 20%;
    animation-delay: 2s;
}

.dekorasi-4 {
    bottom: 15%;
    right: 17%;
    animation-delay: 0.5s;
}

@keyframes backgroundBergerak {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}

@keyframes munculTeks {
    from {
        opacity: 0;
        transform: translateY(30px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@keyframes teksMengambang {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
}

@keyframes kedipTeks {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.45; }
}

@keyframes dekorasiMengambang {
    0%, 100% {
        transform: translateY(0) rotate(0deg);
    }
    50% {
        transform: translateY(-20px) rotate(12deg);
    }
}

/* ================= DASHBOARD ================= */

header {
    background: linear-gradient(135deg, #e7c9ff, #f8d9ed);
    text-align: center;
    padding: 35px 15px;
    border-bottom: 4px solid #c69af0;
}

header h1 {
    color: #7544a5;
    margin: 0 0 10px;
}

header p {
    color: #765d83;
    margin: 0;
}

.container {
    max-width: 1100px;
    margin: 35px auto;
    padding: 0 20px;
}

h2 {
    color: #7544a5;
}

#dashboard > h2 {
    text-align: center;
}

/* ================= KARTU MENU ================= */

.stack-container {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 25px;
    margin: 40px auto 15px;
}

.card-wrapper {
    width: 320px;
    min-height: 300px;
    position: relative;
}

.stack-card {
    width: 100%;
    min-height: 290px;
    padding: 35px 20px;
    text-align: center;

    background: linear-gradient(145deg, #ffffff, #f5eaff);
    border: 2px solid #d9b8f5;
    border-radius: 22px;

    box-shadow:
        8px 8px 0 #ead8fa,
        16px 16px 0 #f0e4fa,
        0 12px 25px #a77ac533;

    transition: opacity 0.2s ease, transform 0.25s ease;
}

.stack-card:hover {
    transform: translateY(-4px);
}

.stack-card h3 {
    color: #7544a5;
    font-size: 21px;
}

.stack-card p {
    color: #887493;
    margin-bottom: 25px;
}

.icon {
    font-size: 55px;
    margin-bottom: 20px;
}

.nav-button {
    width: 48px;
    height: 48px;
    flex-shrink: 0;
    border-radius: 50%;
    padding: 0;

    background: #ead8fa;
    color: #7544a5;
    border: 1px solid #d4b2ef;
    font-size: 20px;
}

.nav-button:hover {
    background: #d9b8f5;
}

.indikator {
    text-align: center;
    color: #887493;
    margin-top: 25px;
}

/* ANIMASI SLIDING */

.slide-out-left {
    animation: keluarKiri 0.2s forwards;
}

.slide-out-right {
    animation: keluarKanan 0.2s forwards;
}

.slide-in-left {
    animation: masukKiri 0.35s ease;
}

.slide-in-right {
    animation: masukKanan 0.35s ease;
}

@keyframes keluarKiri {
    to {
        opacity: 0;
        transform: translateX(-80px) scale(0.9);
    }
}

@keyframes keluarKanan {
    to {
        opacity: 0;
        transform: translateX(80px) scale(0.9);
    }
}

@keyframes masukKiri {
    from {
        opacity: 0;
        transform: translateX(-80px) scale(0.9);
    }
    to {
        opacity: 1;
        transform: translateX(0) scale(1);
    }
}

@keyframes masukKanan {
    from {
        opacity: 0;
        transform: translateX(80px) scale(0.9);
    }
    to {
        opacity: 1;
        transform: translateX(0) scale(1);
    }
}

/* ================= FORM PROGRAM ================= */

.panel {
    background: white;
    padding: 28px;
    margin-top: 25px;
    border-radius: 16px;
    border: 2px solid #ead9fa;
    box-shadow: 0 5px 18px #a77ac51c;
}

.panel h2 {
    margin-top: 0;
    border-bottom: 1px solid #ead9fa;
    padding-bottom: 15px;
}

label {
    display: block;
    font-weight: bold;
    font-size: 14px;
    color: #604577;
    margin-top: 12px;
}

input, select {
    width: 100%;
    padding: 12px;
    margin: 8px 0 15px;
    border: 1px solid #dcc5ee;
    border-radius: 9px;
    font-size: 15px;
    background: #fcf9ff;
    color: #40334f;
}

input:focus, select:focus {
    outline: 2px solid #e9d6fa;
    border-color: #a875d8;
}

button {
    background: linear-gradient(135deg, #a875dc, #9160c5);
    color: white;
    border: none;
    padding: 12px 20px;
    border-radius: 9px;
    cursor: pointer;
    font-size: 14px;
    margin: 5px 5px 5px 0;
}

button:hover {
    background: linear-gradient(135deg, #9360c7, #7945ad);
}

.back {
    background: #f1e4fc;
    color: #7544a5;
    border: 1px solid #dcc1f3;
}

.back:hover {
    background: #e7d1fa;
}

.result {
    background: #faf4ff;
    color: #49345c;
    padding: 18px;
    margin: 20px 0;
    border-radius: 10px;
    border-left: 5px solid #b77de4;
    line-height: 1.8;
    overflow-wrap: anywhere;
}

.result h3 {
    color: #7544a5;
    margin-top: 0;
}

footer {
    text-align: center;
    padding: 25px;
    color: #987fa7;
    font-size: 13px;
}

/* ================= TAMPILAN HP ================= */

@media (max-width: 500px) {
    header h1 {
        font-size: 23px;
    }

    .container {
        padding: 0 12px;
    }

    .stack-container {
        gap: 10px;
    }

    .card-wrapper {
        width: 230px;
        min-height: 280px;
    }

    .stack-card {
        min-height: 270px;
        padding: 25px 12px;
        box-shadow:
            5px 5px 0 #ead8fa,
            10px 10px 0 #f0e4fa;
    }

    .nav-button {
        width: 38px;
        height: 38px;
        font-size: 16px;
    }

    .panel {
        padding: 18px;
    }
}

@media (prefers-reduced-motion: reduce) {
    #welcomeScreen,
    .welcome-content,
    .welcome-content h1,
    .welcome-content p,
    .welcome-dekorasi {
        animation: none;
    }
}
</style>
</head>

<body>

<!-- ================= HALAMAN PEMBUKA ================= -->

<div id="welcomeScreen">
    <span class="welcome-dekorasi dekorasi-1">✨</span>
    <span class="welcome-dekorasi dekorasi-2">💜</span>
    <span class="welcome-dekorasi dekorasi-3">🌸</span>
    <span class="welcome-dekorasi dekorasi-4">⭐</span>

    <div class="welcome-content">
        <h1>SELAMAT DATANG DI WEB</h1>
        <p>⌨️ Tekan Enter untuk lanjut ⌨️</p>
    </div>
</div>

<!-- ================= WEBSITE UTAMA ================= -->

<div id="mainWebsite" class="hidden">

<header>
    <h1>🧩 Dashboard Logika Dasar JS</h1>
    <p>Pilih menu JS di bawah ini untuk memulai program logika</p>
</header>

<div class="container">

    <!-- DASHBOARD MENU -->

    <div id="dashboard">
        <h2>Pilih Menu Program</h2>

        <div class="stack-container">

            <button class="nav-button" onclick="geserMenu(-1)">❮</button>

            <div class="card-wrapper">
                <div class="stack-card" id="kartuMenu">
                    <div class="icon" id="ikonMenu">🎂</div>
                    <h3 id="judulMenu">1. Umur</h3>
                    <p id="deskripsiMenu">Klarifikasi umur</p>
                    <button onclick="pilihMenu()">Pilih Menu</button>
                </div>
            </div>

            <button class="nav-button" onclick="geserMenu(1)">❯</button>

        </div>

        <p class="indikator" id="indikatorMenu">1 / 6</p>
    </div>

    <!-- AREA PROGRAM -->

    <div id="areaProgram" class="panel hidden">
        <h2 id="judulProgram">Program</h2>

        <div id="formProgram"></div>

        <div id="hasil" class="result hidden"></div>

        <button class="back" onclick="kembali()">
            ← Kembali ke Dashboard
        </button>
    </div>

</div>

<footer>
    Dashboard Logika Dasar JavaScript | Projek Pembelajaran
</footer>

</div>

<script>

/* ================= DATA MENU ================= */

const daftarMenu = [
    {
        judul: "1. Umur",
        deskripsi: "Klarifikasi umur",
        ikon: "🎂"
    },
    {
        judul: "2. Positif / Negatif",
        deskripsi: "Menentukan jenis bilangan",
        ikon: "➕"
    },
    {
        judul: "3. Angka Terbesar",
        deskripsi: "Membandingkan dua angka",
        ikon: "⚖️"
    },
    {
        judul: "4. Nilai Predikat",
        deskripsi: "Menentukan predikat nilai",
        ikon: "📊"
    },
    {
        judul: "5. Data Sekolah",
        deskripsi: "Menu data sekolah",
        ikon: "🏆"
    },
    {
        judul: "6. Nilai Siswa",
        deskripsi: "Menghitung nilai akhir",
        ikon: "📝"
    }
];

let menuSekarang = 0;
let sedangBergerak = false;

const dashboard = document.getElementById("dashboard");
const area = document.getElementById("areaProgram");
const judul = document.getElementById("judulProgram");
const form = document.getElementById("formProgram");
const hasil = document.getElementById("hasil");
const kartu = document.getElementById("kartuMenu");
const welcomeScreen = document.getElementById("welcomeScreen");
const mainWebsite = document.getElementById("mainWebsite");

/* ================= HALAMAN PEMBUKA ================= */

document.addEventListener("keydown", function(event) {
    if (
        event.key === "Enter" &&
        !welcomeScreen.classList.contains("sembunyi")
    ) {
        event.preventDefault();

        welcomeScreen.classList.add("sembunyi");
        mainWebsite.classList.remove("hidden");
    }
});

/* ================= NAVIGASI MENU ================= */

function tampilkanKartu() {
    const menu = daftarMenu[menuSekarang];

    document.getElementById("judulMenu").innerText = menu.judul;
    document.getElementById("deskripsiMenu").innerText = menu.deskripsi;
    document.getElementById("ikonMenu").innerText = menu.ikon;

    document.getElementById("indikatorMenu").innerText =
        (menuSekarang + 1) + " / " + daftarMenu.length;
}

function geserMenu(arah) {
    if (sedangBergerak) return;

    sedangBergerak = true;

    kartu.classList.remove("slide-in-left", "slide-in-right");

    kartu.classList.add(
        arah === 1 ? "slide-out-left" : "slide-out-right"
    );

    setTimeout(function() {
        menuSekarang =
            (menuSekarang + arah + daftarMenu.length) % daftarMenu.length;

        tampilkanKartu();

        kartu.classList.remove("slide-out-left", "slide-out-right");

        kartu.classList.add(
            arah === 1 ? "slide-in-right" : "slide-in-left"
        );

        setTimeout(function() {
            kartu.classList.remove("slide-in-left", "slide-in-right");
            sedangBergerak = false;
        }, 350);

    }, 200);
}

function pilihMenu() {
    bukaMenu(menuSekarang + 1);
}

/* ================= MEMBUKA PROGRAM ================= */

function bukaMenu(nomor) {
    dashboard.classList.add("hidden");
    area.classList.remove("hidden");

    hasil.classList.add("hidden");
    hasil.innerHTML = "";

    if (nomor === 1) {
        judul.innerText = "1. Klarifikasi Umur";

        form.innerHTML = `
            <label>Masukkan umur:</label>
            <input type="number" id="umur" min="0" placeholder="Contoh: 17">
            <button onclick="cekUmur()">Periksa Umur</button>
        `;

    } else if (nomor === 2) {
        judul.innerText = "2. Bilangan Positif dan Negatif";

        form.innerHTML = `
            <label>Masukkan angka:</label>
            <input type="number" id="angka" placeholder="Masukkan angka">
            <button onclick="cekAngka()">Periksa Angka</button>
        `;

    } else if (nomor === 3) {
        judul.innerText = "3. Menentukan Angka Terbesar";

        form.innerHTML = `
            <label>Angka pertama:</label>
            <input type="number" id="angka1">

            <label>Angka kedua:</label>
            <input type="number" id="angka2">

            <button onclick="cekTerbesar()">Bandingkan Angka</button>
        `;

    } else if (nomor === 4) {
        judul.innerText = "4. Menentukan Predikat Nilai";

        form.innerHTML = `
            <label>Masukkan nilai (0-100):</label>
            <input type="number" id="nilai" min="0" max="100">
            <button onclick="cekNilai()">Periksa Nilai</button>
        `;

    } else if (nomor === 5) {
        judul.innerText = "5. Menu Data Sekolah";

        form.innerHTML = `
            <label>Pilih menu:</label>

            <select id="menuSekolah">
                <option value="1">Data Siswa</option>
                <option value="2">Data Guru</option>
                <option value="3">Data Kelas</option>
                <option value="4">Keluar dari menu data sekolah</option>
            </select>

            <button onclick="cekMenuSekolah()">Pilih Menu</button>
        `;

    } else if (nomor === 6) {
        judul.innerText = "6. Menghitung Nilai Akhir Siswa";

        form.innerHTML = `
            <label>Nama siswa:</label>
            <input type="text" id="nama">

            <label>Kelas:</label>
            <input type="text" id="kelas">

            <label>Nilai tugas:</label>
            <input type="number" id="tugas" min="0" max="100">

            <label>Nilai UTS:</label>
            <input type="number" id="uts" min="0" max="100">

            <label>Nilai UAS:</label>
            <input type="number" id="uas" min="0" max="100">

            <button onclick="hitungNilai()">Hitung Nilai</button>
        `;
    }
}

/* ================= VALIDASI INPUT ================= */

function angkaValid(id) {
    const input = document.getElementById(id);
    const nilai = input.valueAsNumber;

    if (input.value.trim() === "" || !Number.isFinite(nilai)) {
        alert("Silakan masukkan angka terlebih dahulu!");
        input.focus();
        return null;
    }

    return nilai;
}

function tampilkanHasil(teks) {
    hasil.innerHTML = teks;
    hasil.classList.remove("hidden");
}

/* ================= PROGRAM 1: UMUR ================= */

function cekUmur() {
    const umur = angkaValid("umur");

    if (umur === null) return;

    if (umur < 0) {
        tampilkanHasil("Umur tidak valid.");
    } else if (umur >= 17) {
        tampilkanHasil("✅ Sudah cukup umur.");
    } else {
        tampilkanHasil("❌ Maaf, umur Anda belum cukup.");
    }
}

/* ================= PROGRAM 2: BILANGAN ================= */

function cekAngka() {
    const angka = angkaValid("angka");

    if (angka === null) return;

    if (angka === 0) {
        tampilkanHasil("Bilangan nol.");
    } else if (angka < 0) {
        tampilkanHasil("Bilangan negatif.");
    } else {
        tampilkanHasil("Bilangan positif.");
    }
}

/* ================= PROGRAM 3: ANGKA TERBESAR ================= */

function cekTerbesar() {
    const angka1 = angkaValid("angka1");

    if (angka1 === null) return;

    const angka2 = angkaValid("angka2");

    if (angka2 === null) return;

    if (angka1 > angka2) {
        tampilkanHasil("Angka terbesar adalah " + angka1);
    } else if (angka2 > angka1) {
        tampilkanHasil("Angka terbesar adalah " + angka2);
    } else {
        tampilkanHasil("Kedua angka sama besar.");
    }
}

/* ================= PROGRAM 4: PREDIKAT NILAI ================= */

function cekNilai() {
    const nilai = angkaValid("nilai");

    if (nilai === null) return;

    if (nilai < 0 || nilai > 100) {
        tampilkanHasil("Nilai tidak valid. Masukkan angka 0-100.");
    } else if (nilai >= 90) {
        tampilkanHasil("Predikat A");
    } else if (nilai >= 80) {
        tampilkanHasil("Predikat B");
    } else if (nilai >= 70) {
        tampilkanHasil("Predikat C");
    } else if (nilai >= 60) {
        tampilkanHasil("Predikat D");
    } else {
        tampilkanHasil("Predikat E");
    }
}

/* ================= PROGRAM 5: DATA SEKOLAH ================= */

function cekMenuSekolah() {
    const menu = document.getElementById("menuSekolah").value;

    const daftar = {
        "1": "Menu Data Siswa",
        "2": "Menu Data Guru",
        "3": "Menu Data Kelas",
        "4": "Keluar dari menu data sekolah"
    };

    tampilkanHasil(daftar[menu]);
}

/* ================= PROGRAM 6: NILAI AKHIR ================= */

function hitungNilai() {
    const nama = document.getElementById("nama").value.trim();
    const kelas = document.getElementById("kelas").value.trim();

    if (nama === "" || kelas === "") {
        alert("Nama dan kelas harus diisi!");
        return;
    }

    const tugas = angkaValid("tugas");
    if (tugas === null) return;

    const uts = angkaValid("uts");
    if (uts === null) return;

    const uas = angkaValid("uas");
    if (uas === null) return;

    if ([tugas, uts, uas].some(n => n < 0 || n > 100)) {
        tampilkanHasil("Nilai harus berada di antara 0-100.");
        return;
    }

    const nilaiAkhir =
        (0.3 * tugas) +
        (0.3 * uts) +
        (0.4 * uas);

    let keterangan;

    if (nilaiAkhir >= 90) {
        keterangan = "Sangat Baik";
    } else if (nilaiAkhir >= 80) {
        keterangan = "Baik";
    } else if (nilaiAkhir >= 75) {
        keterangan = "Cukup";
    } else {
        keterangan = "Belum Lulus";
    }

    tampilkanHasil(`
        <h3>Hasil Penilaian</h3>
        Nama: ${aman(nama)}<br>
        Kelas: ${aman(kelas)}<br>
        Nilai Tugas: ${tugas}<br>
        Nilai UTS: ${uts}<br>
        Nilai UAS: ${uas}<br>
        Nilai Akhir: ${nilaiAkhir.toFixed(2)}<br>
        Keterangan: <b>${keterangan}</b>
    `);
}

/* ================= KEAMANAN TAMPILAN NAMA ================= */

function aman(teks) {
    return teks.replace(/[&<>"']/g, karakter => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
    })[karakter]);
}

/* ================= KEMBALI KE DASHBOARD ================= */

function kembali() {
    area.classList.add("hidden");
    dashboard.classList.remove("hidden");

    hasil.classList.add("hidden");
    hasil.innerHTML = "";
}

/* ================= KONTROL KEYBOARD ================= */

document.addEventListener("keydown", function(event) {

    // Enter untuk melewati halaman pembuka
    if (!welcomeScreen.classList.contains("sembunyi")) {
        return;
    }

    // Panah kiri dan kanan hanya bekerja di dashboard
    if (!mainWebsite.classList.contains("hidden") &&
        !dashboard.classList.contains("hidden")) {

        if (event.key === "ArrowRight") {
            event.preventDefault();
            geserMenu(1);
        }

        if (event.key === "ArrowLeft") {
            event.preventDefault();
            geserMenu(-1);
        }
    }
});

/* ================= MULAI WEBSITE ================= */

tampilkanKartu();

</script>

</body>
</html>
